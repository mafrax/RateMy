# Prometheus Alert Rules for RateMe

groups:
  - name: ratemy-alerts
    rules:
      # Application Health Alerts
      - alert: ApplicationDown
        expr: up{job="ratemy-app"} == 0
        for: 1m
        labels:
          severity: critical
          service: ratemy
        annotations:
          summary: "RateMe application is down"
          description: "RateMe application has been down for more than 1 minute"

      - alert: HighResponseTime
        expr: avg(rate(http_request_duration_seconds_sum[5m])) / avg(rate(http_request_duration_seconds_count[5m])) > 2
        for: 5m
        labels:
          severity: warning
          service: ratemy
        annotations:
          summary: "High response time detected"
          description: "Average response time is {{ $value }}s over the last 5 minutes"

      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
          service: ratemy
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} over the last 5 minutes"

      # Database Alerts
      - alert: DatabaseDown
        expr: up{job="postgres-exporter"} == 0
        for: 1m
        labels:
          severity: critical
          service: postgres
        annotations:
          summary: "PostgreSQL database is down"
          description: "PostgreSQL database has been down for more than 1 minute"

      - alert: DatabaseConnections
        expr: pg_stat_database_numbackends > 80
        for: 5m
        labels:
          severity: warning
          service: postgres
        annotations:
          summary: "High number of database connections"
          description: "Database has {{ $value }} active connections"

      - alert: DatabaseDiskUsage
        expr: (pg_database_size_bytes / 1024 / 1024 / 1024) > 8
        for: 5m
        labels:
          severity: warning
          service: postgres
        annotations:
          summary: "Database disk usage is high"
          description: "Database size is {{ $value }}GB"

      # Redis Alerts
      - alert: RedisDown
        expr: up{job="redis-exporter"} == 0
        for: 1m
        labels:
          severity: warning
          service: redis
        annotations:
          summary: "Redis cache is down"
          description: "Redis cache has been down for more than 1 minute"

      - alert: RedisMemoryUsage
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.9
        for: 5m
        labels:
          severity: warning
          service: redis
        annotations:
          summary: "Redis memory usage is high"
          description: "Redis memory usage is {{ $value | humanizePercentage }}"

      # System Resource Alerts
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "High CPU usage detected"
          description: "CPU usage is {{ $value }}% on {{ $labels.instance }}"

      - alert: HighMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes > 0.9
        for: 5m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "High memory usage detected"
          description: "Memory usage is {{ $value | humanizePercentage }} on {{ $labels.instance }}"

      - alert: LowDiskSpace
        expr: (node_filesystem_avail_bytes{fstype!="tmpfs"} / node_filesystem_size_bytes) < 0.1
        for: 5m
        labels:
          severity: critical
          service: system
        annotations:
          summary: "Low disk space"
          description: "Disk space is {{ $value | humanizePercentage }} available on {{ $labels.instance }}"

      # SSL Certificate Alerts
      - alert: SSLCertificateExpiry
        expr: ssl_cert_not_after - time() < 7 * 24 * 3600
        for: 1h
        labels:
          severity: warning
          service: ssl
        annotations:
          summary: "SSL certificate expiring soon"
          description: "SSL certificate for {{ $labels.instance }} expires in {{ $value | humanizeDuration }}"

      # Container Alerts
      - alert: ContainerDown
        expr: absent(container_last_seen{name=~"ratemy-.*"})
        for: 1m
        labels:
          severity: critical
          service: docker
        annotations:
          summary: "Container is down"
          description: "Container {{ $labels.name }} is not running"

      - alert: ContainerHighMemoryUsage
        expr: container_memory_usage_bytes{name=~"ratemy-.*"} / container_spec_memory_limit_bytes > 0.9
        for: 5m
        labels:
          severity: warning
          service: docker
        annotations:
          summary: "Container memory usage is high"
          description: "Container {{ $labels.name }} memory usage is {{ $value | humanizePercentage }}"

      # Load Balancer Alerts
      - alert: LoadBalancerDown
        expr: up{job="traefik"} == 0
        for: 1m
        labels:
          severity: critical
          service: traefik
        annotations:
          summary: "Load balancer is down"
          description: "Traefik load balancer has been down for more than 1 minute"

      # External Monitoring Alerts
      - alert: HealthCheckFailed
        expr: probe_success{job="blackbox"} == 0
        for: 1m
        labels:
          severity: critical
          service: external
        annotations:
          summary: "Health check failed"
          description: "Health check for {{ $labels.instance }} has been failing for 1 minute"

      - alert: SlowHealthCheck
        expr: probe_duration_seconds{job="blackbox"} > 5
        for: 5m
        labels:
          severity: warning
          service: external
        annotations:
          summary: "Slow health check response"
          description: "Health check for {{ $labels.instance }} is taking {{ $value }}s"